name: flinq
description: FlinQ — fotoğraf, video ve hikaye paylaşım uygulaması (Flutter).
publish_to: 'none'
version: 2.0.0+20

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.4
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

  provider: ^6.1.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  video_player: ^2.9.2
  share_plus: ^10.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/
